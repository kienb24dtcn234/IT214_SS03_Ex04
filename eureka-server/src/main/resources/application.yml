# application.yml của eureka-server (registry trung tâm)

server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false    # Eureka Server không tự đăng ký chính nó
    fetch-registry: false          # cũng không cần tải danh bạ về
  instance:
    hostname: eureka-server
